services:
  django:
    build:
      context: ./backend/rosie
    container_name: rosie-backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - ./backend/rosie/.env
    depends_on:
      postgres:
        condition: service_started
    networks:
      - app_net

  postgres:
    image: postgres:15
    container_name: rosie-db
    environment:
      POSTGRES_DB: rosie
      POSTGRES_USER: rosie
      POSTGRES_PASSWORD: rosie
    ports:
      - "5432:5432"
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend/rosie
      args:
        NEXT_PUBLIC_DOCS_URL: http://localhost:3001
    container_name: rosie-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_DOCS_URL: http://localhost:3001
    depends_on:
      - django
    networks:
      - app_net

  docs:
    build:
      context: ./docs/rosie
      dockerfile: Dockerfile.dev
    container_name: rosie-docs
    working_dir: /workspace/docs/rosie
    command: >
      sh -c "npm install && npm run start -- --poll"
    ports:
      - "3001:3001"
    environment:
      APP_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/workspace
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
